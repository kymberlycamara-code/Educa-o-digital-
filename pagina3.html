

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ford Del Rey - Clássico</title>
  <!-- Link para o arquivo CSS externo (ou cole dentro da tag <style>) -->
  <link rel="stylesheet" href="estilodelrey.css">
</head>
<body>

  <!-- Card inspirado no painel e emblema do Del Rey -->
  <div class="del-rei-card">
    
    <!-- Nome e Versão do Carro -->
    <h1>DEL REY</h1>
    <div class="versao">Série Ouro • 1.6</div>

    <!-- Homenagem ao famoso relógio digital de LED no teto/painel -->
    <div class="relogio-digital">
      12:30
    </div>

    <!-- Botão interativo no estilo retro -->
    <button class="btn-liga" onclick="darPartida()">Dar Partida</button>

  </div>

  <script>
    function darPartida() {
      alert("Vrummm! O motor CHT/Corcel do Del Rey está ligado com todo o conforto!");
    }
  </script>

</body>
</html>
